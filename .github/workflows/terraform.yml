name: terraform

# Checks only. A plan or apply needs the Azure OIDC variables from the
# foundation outputs (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID)
# and a protected "lab" environment; add those jobs once foundation is applied.

on:
  pull_request:
    paths: ["bootstrap/**", "foundation/**", "lab/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["bootstrap/**", "foundation/**", "lab/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [bootstrap, foundation, lab]
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init (no backend)
        run: terraform init -backend=false -input=false

      - name: validate
        run: terraform validate

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: |
          tflint --init
          for d in bootstrap foundation lab; do
            echo "== $d =="
            tflint --chdir="$d" || exit 1
          done
